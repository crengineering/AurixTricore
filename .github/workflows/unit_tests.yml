name: Unit tests

on:
  push:
    #branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:  # if commits getting staged and pipeline is not finished, it stops and only runs on the newest commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittests:
    name: C Unit tests
    runs-on: ubuntu-latest            # already includes ninja, therefore no installation needed
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Unit tests
        run: python3 tools/utest.py --werror
  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Sanitize checks
        run: python3 tools/utest.py --werror --variant sanitize
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pip install gcovr
      - name: Run coverage checks
        run: python3 tools/utest.py --werror --variant coverage
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test/build_cov/coverage/